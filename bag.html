<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag | LoJi Luxury Concierge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0F0F11', brandLight: '#FFFFFF', brandCard: '#F8F9FA', brandBorder: '#E5E7EB', goldAccent: '#B8860B' }
        }
      }
    }
  </script>
  <script src="assets/js/cart.js"></script>
</head>
<body class="bg-brandLight text-zinc-800 antialiased min-h-screen flex flex-col justify-between" onload="renderBag(); syncCartBadgeGlobal();">

  <nav class="w-full py-6 px-6 md:px-12 flex justify-between items-center bg-white border-b border-brandBorder">
    <a href="." class="font-serif text-2xl tracking-[0.2em] font-bold"><span class="text-brandDark">Lo</span><span class="text-goldAccent">Ji</span></a>
    <a href="." class="text-xs uppercase tracking-widest font-bold text-zinc-500 hover:text-brandDark">← Back To Showroom</a>
  </nav>

  <main class="max-w-2xl w-full mx-auto p-6 flex-1 py-12 space-y-6">
    <h1 class="text-2xl font-serif text-brandDark font-bold tracking-wide">Your Curated Session Bag</h1>
    
    <div id="checkout-bag-list" class="space-y-4"></div>

    <div id="bag-summary-card" class="bg-brandCard p-6 rounded border border-brandBorder space-y-4 hidden">
      <div class="space-y-2 text-xs uppercase tracking-wider font-semibold border-b pb-4 text-zinc-500">
        <div class="flex justify-between"><span>Gross Total</span><span id="gross-total-price" class="font-bold text-brandDark">₹0</span></div>
        <div class="flex justify-between text-emerald-600"><span>10% Savings</span><span id="savings-total-price" class="font-bold">-₹0</span></div>
        <div class="flex justify-between text-sm pt-2 border-t border-dashed border-brandBorder text-brandDark">
          <span class="font-bold">Net Amount Payable</span><span id="bag-total-price" class="font-bold text-lg text-brandDark">₹0</span>
        </div>
      </div>

      <button onclick="processCheckoutVerification()" class="w-full text-center py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs uppercase tracking-widest transition rounded shadow-md">
        ⚡ Verify & Launch UPI Gateway Payments
      </button>
    </div>
  </main>

  <script>
    let currentBag = [];

    function renderBag() {
        const savedData = localStorage.getItem('loji_cart');
        const container = document.getElementById('checkout-bag-list');
        const summaryCard = document.getElementById('bag-summary-card');
        
        if (!savedData || JSON.parse(savedData).length === 0) {
            container.innerHTML = `<p class="text-zinc-400 font-light text-center py-12 border border-dashed rounded">Your styling bag is currently empty.</p>`;
            summaryCard.classList.add('hidden');
            return;
        }

        currentBag = JSON.parse(savedData);
        container.innerHTML = '';
        summaryCard.classList.remove('hidden');
        
        let netTotal = 0, grossTotal = 0;

        currentBag.forEach((item, index) => {
            let finalPrice = parseInt(item.price);
            let origPrice = parseInt(item.originalPrice || Math.round(finalPrice / 0.9));
            netTotal += finalPrice; grossTotal += origPrice;

            const div = document.createElement('div');
            div.className = "flex justify-between items-center p-4 bg-brandCard border border-brandBorder rounded shadow-sm";
            div.innerHTML = `
                <div>
                    <h4 class="font-serif font-bold text-brandDark">${item.productName}</h4>
                    <p class="text-[10px] text-goldAccent uppercase mt-0.5">${item.category} • Size: ${item.size}</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right"><span class="text-zinc-400 line-through text-xs block">₹${origPrice}</span><span class="font-bold block text-sm">₹${finalPrice}</span></div>
                    <button onclick="removeItem(${index})" class="text-zinc-400 hover:text-red-600 text-xs pl-2">✕</button>
                </div>`;
            container.appendChild(div);
        });

        document.getElementById('gross-total-price').textContent = `₹${grossTotal}`;
        document.getElementById('savings-total-price').textContent = `-₹${grossTotal - netTotal}`;
        document.getElementById('bag-total-price').textContent = `₹${netTotal}`;
    }

    function removeItem(index) {
        currentBag.splice(index, 1);
        localStorage.setItem('loji_cart', JSON.stringify(currentBag));
        renderBag();
        syncCartBadgeGlobal();
    }

    function processCheckoutVerification() {
        let netTotal = currentBag.reduce((sum, item) => sum + parseInt(item.price), 0);
        let cName = prompt("Enter Customer Name for Shipping Verification:");
        let cPhone = prompt("Enter Contact Number (WhatsApp tracking destination):");
        let cEmail = prompt("Enter Email Address for Invoice Delivery:");

        if (cName && cPhone && cEmail) {
            const upiAddress = "9411300440@paytm";
            window.location.href = `upi://pay?pa=${upiAddress}&pn=LoJi%20Store&am=${netTotal}&cu=INR&tn=LoJi%20Order`;
            
            // Fires the background tracker engineered in cart.js
            dispatchOrderAutomatedNotifications(cName, cPhone, cEmail, netTotal, currentBag);
            
            setTimeout(() => {
                alert("Order Dispatched Successfully. Check your WhatsApp and email for confirmation logs!");
                localStorage.removeItem('loji_cart');
                window.location.href = ".";
            }, 1000);
        } else {
            alert("All customer fields are required for live transaction logs.");
        }
    }
  </script>
</body>
</html>
