<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | LoJi Luxury Showroom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0F0F11', brandLight: '#FFFFFF', brandCard: '#F8F9FA', brandBorder: '#E5E7EB', goldAccent: '#B8860B' }
        }
      }
    }
  </script>
  <script src="assets/js/cart.js"></script>
</head>
<body class="bg-brandLight text-zinc-800 antialiased min-h-screen flex flex-col justify-between" onload="syncCartBadgeGlobal()">

  <nav class="w-full py-6 px-6 md:px-12 flex justify-between items-center bg-white border-b border-brandBorder sticky top-0 z-50">
    <a href="." class="font-serif text-2xl tracking-[0.2em] font-bold"><span class="text-brandDark">Lo</span><span class="text-goldAccent">Ji</span></a>
    <div class="flex items-center space-x-6">
      <a href="." class="text-xs uppercase tracking-widest font-bold text-zinc-500 hover:text-brandDark">← Showroom</a>
      <a href="bag.html" class="relative block">
         <span class="text-zinc-700 font-bold text-xs uppercase tracking-widest">Bag</span>
         <span id="global-nav-badge" class="absolute -top-3 -right-4 bg-[#B8860B] text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">0</span>
      </a>
    </div>
  </nav>

  <main class="max-w-5xl w-full mx-auto p-6 py-12 flex-1">
    <div id="product-view-container" class="grid grid-cols-1 md:grid-cols-12 gap-12 items-center">
      <div class="md:col-span-6 w-full h-[450px] bg-brandCard border border-brandBorder rounded overflow-hidden">
        <img id="display-product-img" class="w-full h-full object-cover" alt="Loading asset...">
      </div>

      <div class="md:col-span-6 space-y-6">
        <div class="space-y-2">
          <span id="display-product-cat" class="text-[9px] bg-goldAccent/10 text-goldAccent font-bold px-2.5 py-1 rounded border border-goldAccent/20 uppercase tracking-widest inline-block">Category</span>
          <h1 id="display-product-title" class="text-3xl font-serif font-bold text-brandDark tracking-tight">Loading...</h1>
          <div class="flex items-center space-x-3 pt-1">
            <span id="display-old-price" class="text-zinc-400 line-through text-sm">₹0</span>
            <span id="display-new-price" class="text-brandDark font-bold text-xl">₹0</span>
            <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">10% Standard Offer Applied</span>
          </div>
        </div>
        <hr class="border-brandBorder">
        <p id="display-product-desc" class="text-zinc-600 text-sm leading-relaxed font-light"></p>

        <div class="space-y-2">
          <label class="block text-[10px] uppercase tracking-widest font-bold text-zinc-400">Select Tailor Configuration Dimension</label>
          <div class="flex gap-2" id="size-box">
            <button onclick="selectSize(this)" class="border border-brandDark bg-brandDark text-white text-xs font-bold px-4 py-2 rounded-sm">Standard Fit</button>
            <button onclick="selectSize(this)" class="border border-brandBorder text-zinc-600 text-xs font-bold px-4 py-2 rounded-sm hover:border-brandDark">Custom Tailored Fit</button>
          </div>
        </div>

        <button id="add-to-bag-cta" class="w-full block text-center py-4 bg-brandDark hover:bg-goldAccent text-white hover:text-brandDark font-bold text-xs uppercase tracking-[0.2em] transition-all rounded shadow-md">
          Secure & Curate Selection to Bag
        </button>
      </div>
    </div>
  </main>

  <script>
    const SHOWROOM_DATABASE = {
      "high-waist-jeans": { name: "Premium High-Waist Jeans", original: 1899, final: 1709, cat: "Womens Apparel", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&q=80&w=600", desc: "Super stretch luxury comfort denims featuring custom engineered contours. Built exclusively for premium high-waist classic form silhouettes." },
      "linen-co-ord": { name: "Luxury Linen Co-Ord Set", original: 2499, final: 2249, cat: "Womens Apparel", img: "https://images.unsplash.com/photo-1609357605129-26f69add5d6e?auto=format&fit=crop&q=80&w=600", desc: "Premium daily breathing linen structures designed with casual modern relaxed cuts, perfect for high-end resort styling profiles." },
      "comfort-denim": { name: "Regular Fit Comfort Denim", original: 1999, final: 1799, cat: "Mens Apparel", img: "https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&q=80&w=600", desc: "Rugged, deep indigo dyed premium denim fabrics structured in an absolute traditional classic regular fit framework for cross-generational resilience." },
      "wedding-kurta": { name: "Handcrafted Wedding Kurta", original: 3999, final: 3599, cat: "Mens Apparel", img: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&q=80&w=600", desc: "Intricately patterned artisan-woven luxury festive kurtas. Styled with clean alignments tailored precisely for signature high-profile wedding events." },
      "imperial-kurta": { name: "The Imperial Wedding Kurta Set", original: 5500, final: 4950, cat: "Mens Premium Apparel", img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&q=80&w=800", desc: "Our floor manager's daily curated lookbook masterpiece. Hand-selected fabrics complete with complimentary sizing adjustments at our flagship showroom counter." }
    };

    let selectedSize = "Standard Fit";
    function selectSize(btn) {
        document.querySelectorAll('#size-box button').forEach(b => b.className = "border border-brandBorder text-zinc-600 text-xs font-bold px-4 py-2 rounded-sm hover:border-brandDark");
        btn.className = "border border-brandDark bg-brandDark text-white text-xs font-bold px-4 py-2 rounded-sm";
        selectedSize = btn.textContent;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const productKey = new URLSearchParams(window.location.search).get('id');
        const item = SHOWROOM_DATABASE[productKey];
        if(!item) return;

        document.getElementById('display-product-img').src = item.img;
        document.getElementById('display-product-title').textContent = item.name;
        document.getElementById('display-product-cat').textContent = item.cat;
        document.getElementById('display-old-price').textContent = `₹${item.original}`;
        document.getElementById('display-new-price').textContent = `₹${item.final}`;
        document.getElementById('display-product-desc').textContent = item.desc;

        document.getElementById('add-to-bag-cta').onclick = () => {
            let lojiCart = JSON.parse(localStorage.getItem('loji_cart') || '[]');
            lojiCart.push({ productName: item.name, price: item.final.toString(), originalPrice: item.original.toString(), category: item.cat, size: selectedSize });
            localStorage.setItem('loji_cart', JSON.stringify(lojiCart));
            window.location.href = "bag.html";
        };
    });
  </script>
</body>
</html>
